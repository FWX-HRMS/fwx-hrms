<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-orb login-orb-1"></div>
    <div class="login-orb login-orb-2"></div>
    <div class="login-orb login-orb-3"></div>
    <div class="login-orb login-orb-4"></div>
    <div class="login-wave-wrap">
      <svg class="login-wave" viewBox="0 0 2400 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,150 C200,220 400,80 600,150 C800,220 1000,80 1200,150 C1400,220 1600,80 1800,150 C2000,220 2200,80 2400,150 L2400,300 L0,300 Z" fill="rgba(26,166,160,0.28)"></path>
      </svg>
      <svg class="login-wave login-wave-2" viewBox="0 0 2400 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,180 C300,110 500,240 800,180 C1100,120 1300,240 1600,180 C1900,120 2100,240 2400,180 L2400,300 L0,300 Z" fill="rgba(55,198,181,0.22)"></path>
      </svg>
    </div>
    <form class="login-card" id="forgotForm">
      <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
      <img src="images/logo.png" alt="FWX" class="login-logo">
      <h1 data-i18n="resetPasswordTitle">Reset password</h1>
      <p class="sub" data-i18n="resetPasswordSub">Enter your file number and we'll email you a reset link.</p>

      <label for="fileNumber" data-i18n="fileNumberLabel">File number</label>
      <input type="text" id="fileNumber" autocomplete="username" required>

      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="sendResetLinkBtn">Send reset link</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg" data-i18n="resetLinkSentMsg">If that file number has an account, a reset link has been sent to the email on file. Check your inbox (and spam folder).</div>
      <p class="forgot-link"><a href="index.html" data-i18n="backToSignIn">Back to sign in</a></p>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    initLangToggle();

    const form = document.getElementById("forgotForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      successMsg.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = t("sending");

      const fileNumber = document.getElementById("fileNumber").value.trim();
      const email = await lookupEmailForFileNumber(fileNumber);

      if (email) {
        await db.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/reset-password.html"
        });
      }

      // Always show the same message, whether or not the file number matched —
      // this avoids revealing which file numbers are valid to an outsider.
      submitBtn.disabled = false;
      submitBtn.textContent = t("sendResetLinkBtn");
      successMsg.classList.add("show");
      form.reset();
    });
  </script>
</body>
</html>
