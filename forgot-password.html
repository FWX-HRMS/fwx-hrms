<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="forgotForm">
      <img src="images/logo.png" alt="FWX" class="login-logo">
      <h1>Reset password</h1>
      <p class="sub">Enter your file number and we'll email you a reset link.</p>

      <label for="fileNumber">File number</label>
      <input type="text" id="fileNumber" autocomplete="username" required>

      <button type="submit" class="btn btn-primary" id="submitBtn">Send reset link</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg">If that file number has an account, a reset link has been sent to the email on file. Check your inbox (and spam folder).</div>
      <p class="forgot-link"><a href="index.html">Back to sign in</a></p>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      successMsg.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      const fileNumber = document.getElementById("fileNumber").value.trim();
      const email = await lookupEmailForFileNumber(fileNumber);

      if (email) {
        await db.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/reset-password.html"
        });
      }

      // Always show the same message, whether or not the file number matched —
      // this avoids revealing which file numbers are valid to an outsider.
      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";
      successMsg.classList.add("show");
      form.reset();
    });
  </script>
</body>
</html>
