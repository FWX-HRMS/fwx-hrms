<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-heavyrain"></div>
    <div class="login-heavyrain login-heavyrain-2"></div>
    <div class="login-fogbank login-fogbank-1"></div>
    <div class="login-fogbank login-fogbank-2"></div>
    <div class="login-fogbank login-fogbank-3"></div>
    <div class="login-mountains">
      <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <polygon class="ridge-back" points="-20,420 -20,328 97,295 214,324 331,347 449,316 566,353 683,354 800,236 917,292 1034,317 1151,359 1269,356 1386,306 1503,329 1620,324 1620,420 -20,420"/>
        <polygon class="ridge-mid" points="-20,460 -20,153 144,137 308,138 472,320 636,308 800,229 964,230 1128,344 1292,203 1456,240 1620,228 1620,460 -20,460"/>
        <polygon class="ridge-front" points="-20,500 -20,283 82,258 185,275 288,108 390,278 492,243 595,295 698,276 800,309 902,335 1005,266 1108,255 1210,284 1312,209 1415,312 1518,250 1620,328 1620,500 -20,500"/>
      </svg>
    </div>
    <div class="login-foreground"></div>
    <div class="login-mist"></div>
    <form class="login-card" id="forgotForm">
      <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
      <img src="images/logo.png" alt="FWX" class="login-logo">
      <h1 data-i18n="resetPasswordTitle">Reset password</h1>
      <p class="sub" data-i18n="resetPasswordSub">Enter your file number and we'll email you a reset link.</p>

      <label for="fileNumber" data-i18n="fileNumberLabel">File number</label>
      <input type="text" id="fileNumber" autocomplete="username" required>

      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="sendResetLinkBtn">Send reset link</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg" data-i18n="resetLinkSentMsg">If that file number has an account, a reset link has been sent to the email on file. Check your inbox (and spam folder).</div>
      <p class="forgot-link"><a href="index.html" data-i18n="backToSignIn">Back to sign in</a></p>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    initLangToggle();

    const form = document.getElementById("forgotForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      successMsg.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = t("sending");

      const fileNumber = document.getElementById("fileNumber").value.trim();
      const email = await lookupEmailForFileNumber(fileNumber);

      if (email) {
        await db.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/reset-password.html"
        });
      }

      // Always show the same message, whether or not the file number matched —
      // this avoids revealing which file numbers are valid to an outsider.
      submitBtn.disabled = false;
      submitBtn.textContent = t("sendResetLinkBtn");
      successMsg.classList.add("show");
      form.reset();
    });
  </script>
</body>
</html>
