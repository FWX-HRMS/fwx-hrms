<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="resetForm">
      <img src="images/logo.png" alt="FWX" class="login-logo">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account.</p>

      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" autocomplete="new-password" required minlength="8">

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8">

      <button type="submit" class="btn btn-primary" id="submitBtn">Update password</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg">Password updated. Redirecting to sign in…</div>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    // Supabase automatically reads the recovery token from the URL and
    // creates a temporary session for this page — nothing to do manually.

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        errorMsg.textContent = "Passwords don't match.";
        errorMsg.classList.add("show");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating…";

      const { error } = await db.auth.updateUser({ password: newPassword });

      if (error) {
        errorMsg.textContent = "This reset link may have expired. Request a new one from the sign-in page.";
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = "Update password";
        return;
      }

      successMsg.classList.add("show");
      await db.auth.signOut();
      setTimeout(() => { window.location.href = "index.html"; }, 2000);
    });
  </script>
</body>
</html>
