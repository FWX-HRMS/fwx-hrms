<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-heavyrain"></div>
    <div class="login-heavyrain login-heavyrain-2"></div>
    <div class="login-fogbank login-fogbank-1"></div>
    <div class="login-fogbank login-fogbank-2"></div>
    <div class="login-fogbank login-fogbank-3"></div>
    <div class="login-mountains">
      <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <polygon class="ridge-back" points="-20,420 -20,328 97,295 214,324 331,347 449,316 566,353 683,354 800,236 917,292 1034,317 1151,359 1269,356 1386,306 1503,329 1620,324 1620,420 -20,420"/>
        <polygon class="ridge-mid" points="-20,460 -20,153 144,137 308,138 472,320 636,308 800,229 964,230 1128,344 1292,203 1456,240 1620,228 1620,460 -20,460"/>
        <polygon class="ridge-front" points="-20,500 -20,283 82,258 185,275 288,108 390,278 492,243 595,295 698,276 800,309 902,335 1005,266 1108,255 1210,284 1312,209 1415,312 1518,250 1620,328 1620,500 -20,500"/>
      </svg>
    </div>
    <div class="login-foreground"></div>
    <div class="login-mist"></div>
    <form class="login-card" id="resetForm">
      <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
      <img src="images/logo.png" alt="FWX" class="login-logo">
      <h1 data-i18n="setNewPasswordTitle">Set a new password</h1>
      <p class="sub" data-i18n="setNewPasswordSub">Choose a new password for your account.</p>

      <label for="newPassword" data-i18n="newPasswordLabel">New password</label>
      <input type="password" id="newPassword" autocomplete="new-password" required minlength="8">

      <label for="confirmPassword" data-i18n="confirmNewPasswordLabel">Confirm new password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8">

      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="updatePasswordBtn">Update password</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg" data-i18n="passwordUpdatedRedirect">Password updated. Redirecting to sign in…</div>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    initLangToggle();

    const form = document.getElementById("resetForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    // Supabase automatically reads the recovery token from the URL and
    // creates a temporary session for this page — nothing to do manually.

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        errorMsg.textContent = t("passwordsDontMatch");
        errorMsg.classList.add("show");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = t("updating");

      const { error } = await db.auth.updateUser({ password: newPassword });

      if (error) {
        errorMsg.textContent = t("resetLinkExpired");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("updatePasswordBtn");
        return;
      }

      successMsg.classList.add("show");
      await db.auth.signOut();
      setTimeout(() => { window.location.href = "index.html"; }, 2000);
    });
  </script>
</body>
</html>
