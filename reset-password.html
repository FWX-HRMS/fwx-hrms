<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — HR Portal</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-spectrum"></div>
    <div class="login-lightorb login-lightorb-1"></div>
    <div class="login-lightorb login-lightorb-2"></div>
    <div class="login-lightorb login-lightorb-3"></div>
    <div class="login-lightorb login-lightorb-4"></div>
    <div class="login-mist"></div>
    <form class="login-card" id="resetForm">
      <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
      <div class="login-logo-row">
        <img src="images/logo.png" alt="FWX" class="login-logo">
        <span class="login-logo-text">FWX HR System</span>
      </div>
      <h1 data-i18n="setNewPasswordTitle">Set a new password</h1>
      <p class="sub" data-i18n="setNewPasswordSub">Choose a new password for your account.</p>

      <label for="newPassword" data-i18n="newPasswordLabel">New password</label>
      <div style="position:relative">
        <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" style="padding-inline-end:40px">
        <button type="button" id="toggleNewPasswordBtn" aria-label="Show password" style="position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; color:var(--ink-soft, #6b7684)">
          <svg id="newPasswordEyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <label for="confirmPassword" data-i18n="confirmNewPasswordLabel">Confirm new password</label>
      <div style="position:relative">
        <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8" style="padding-inline-end:40px">
        <button type="button" id="toggleConfirmPasswordBtn" aria-label="Show password" style="position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; color:var(--ink-soft, #6b7684)">
          <svg id="confirmPasswordEyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="updatePasswordBtn">Update password</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg" data-i18n="passwordUpdatedRedirect">Password updated. Redirecting to sign in…</div>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    initLangToggle();

    // Same show/hide pattern as the sign-in page, applied to both fields
    // independently via a shared helper.
    const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
    const EYE_CLOSED = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

    function wirePasswordToggle(inputId, btnId, iconId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);
      btn.addEventListener("click", () => {
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        icon.innerHTML = isPassword ? EYE_CLOSED : EYE_OPEN;
        btn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
      });
    }

    wirePasswordToggle("newPassword", "toggleNewPasswordBtn", "newPasswordEyeIcon");
    wirePasswordToggle("confirmPassword", "toggleConfirmPasswordBtn", "confirmPasswordEyeIcon");

    const form = document.getElementById("resetForm");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const submitBtn = document.getElementById("submitBtn");

    // Supabase automatically reads the recovery token from the URL and
    // creates a temporary session for this page — nothing to do manually.

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        errorMsg.textContent = t("passwordsDontMatch");
        errorMsg.classList.add("show");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = t("updating");

      const { error } = await db.auth.updateUser({ password: newPassword });

      if (error) {
        errorMsg.textContent = t("resetLinkExpired");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("updatePasswordBtn");
        return;
      }

      successMsg.classList.add("show");
      await db.auth.signOut();
      setTimeout(() => { window.location.href = "index.html"; }, 2000);
    });
  </script>
</body>
</html>
