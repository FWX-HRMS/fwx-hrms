<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Warnings — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
    <div class="brand"><a href="https://www.fwxperts.com/" target="_blank" rel="noopener noreferrer" style="line-height:0"><img src="images/logo.png" alt="FWX" class="brand-logo"></a> <span data-i18n="brandStaffPortal">Staff Portal</span></div>
    <div class="whoami" id="whoami">Loading…</div>
    <a href="settings.html" class="settings-link" data-i18n="settingsLink">⚙ Settings</a>
    <button class="logout" onclick="logout()" data-i18n="logout">Log out</button>
    <div class="sidebar-divider"></div>
    <nav>
      <a href="staff.html" data-i18n="navMyLeave">My leave</a>
      <a href="contract.html" data-i18n="navMyContract">My Contract</a>
      <a href="warnings.html" class="active" data-i18n="navMyWarnings">My Warnings</a>
    </nav>
  </aside>

  <main>
    <h1 class="page-title" data-i18n="myWarningsTitle">My Warnings</h1>
    <p class="page-sub" id="warningsSub"></p>

    <div class="panel">
      <table>
        <thead>
          <tr><th data-i18n="colEmployeeName">Employee Name</th><th data-i18n="colIdNum">ID #</th><th data-i18n="colCompany">Company</th><th data-i18n="warningReasonCol">Reason</th><th data-i18n="colStatus">Status</th><th data-i18n="colCreatedDate">Date</th><th></th></tr>
        </thead>
        <tbody id="warningsBody"></tbody>
      </table>
      <div class="empty-state" id="noWarningsMsg" style="display:none" data-i18n="noWarningsForYou">You have no warnings on file.</div>
    </div>
  </main>
</div>

<!-- View-only warning modal -->
<div id="warningViewOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box" style="max-width:700px">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap">
      <h2 style="margin:0" data-i18n="warningDetailsTitle">Warning</h2>
      <div style="display:flex; gap:10px">
        <button type="button" class="btn btn-blue btn-sm" id="warningConvertBtn"></button>
        <button type="button" class="btn btn-blue btn-sm" id="closeWarningViewBtn" data-i18n="close">Close</button>
      </div>
    </div>
    <div id="warningTextDisplay" dir="rtl" style="white-space:pre-wrap; font-size:14px; text-align:right; line-height:1.8; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:16px; max-height:500px; overflow-y:auto"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/i18n.js"></script>
<script>initLangToggle();</script>
<script src="js/warnings-staff.js"></script>
</body>
</html>
