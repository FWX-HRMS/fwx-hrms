<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Companies — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><a href="https://www.fwxperts.com/" target="_blank" rel="noopener noreferrer" style="line-height:0"><img src="images/logo.png" alt="FWX" class="brand-logo"></a> Supervisor Portal</div>
    <div class="whoami" id="whoami">Loading…</div>
    <nav>
      <a href="supervisor.html">Team overview</a>
      <a href="admin.html">Users</a>
      <a href="clients.html" class="active">Client Companies</a>
    </nav>
    <a href="settings.html" class="settings-link">⚙ Settings</a>
    <button class="logout" onclick="logout()">Log out</button>
  </aside>

  <main>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px">
      <div>
        <h1 class="page-title" style="margin-bottom:4px">Client Companies</h1>
        <p class="page-sub" style="margin-bottom:0">Pick a company to manage its staff and supervisors.</p>
      </div>
      <button type="button" class="btn btn-primary" id="showAddCompanyBtn" style="width:220px">+ Add new client company</button>
    </div>

    <div class="panel" id="addCompanyPanel" style="display:none; max-width:420px; margin:24px 0">
      <h2>New client company</h2>
      <label for="newCompanyName">Company name</label>
      <input type="text" id="newCompanyName" placeholder="e.g. Vodafone">
      <div style="display:flex; gap:10px; margin-top:14px">
        <button type="button" class="btn btn-primary" id="saveCompanyBtn" style="width:140px">Add</button>
        <button type="button" class="btn btn-danger" id="cancelCompanyBtn" style="width:140px">Cancel</button>
      </div>
      <div class="error-msg" id="companyError"></div>
    </div>

    <div class="company-grid" id="companyGrid"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
<script>
let ME = null;

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

document.getElementById("showAddCompanyBtn").addEventListener("click", () => {
  document.getElementById("addCompanyPanel").style.display = "";
  document.getElementById("newCompanyName").value = "";
  document.getElementById("companyError").classList.remove("show");
  document.getElementById("newCompanyName").focus();
});
document.getElementById("cancelCompanyBtn").addEventListener("click", () => {
  document.getElementById("addCompanyPanel").style.display = "none";
});

document.getElementById("saveCompanyBtn").addEventListener("click", async () => {
  const errBox = document.getElementById("companyError");
  errBox.classList.remove("show");
  const name = document.getElementById("newCompanyName").value.trim();
  if (!name) {
    errBox.textContent = "Enter a company name.";
    errBox.classList.add("show");
    return;
  }

  const btn = document.getElementById("saveCompanyBtn");
  btn.disabled = true;
  btn.textContent = "Adding…";

  const { error } = await db.from("client_companies").insert({ name });

  btn.disabled = false;
  btn.textContent = "Add";

  if (error) {
    errBox.textContent = error.code === "23505" ? "That company already exists." : "Something went wrong adding it.";
    errBox.classList.add("show");
    return;
  }

  document.getElementById("addCompanyPanel").style.display = "none";
  showToast("Company added.");
  await loadCompanies();
});

async function loadCompanies() {
  const { data: companies, error } = await db.from("client_companies").select("*").order("name");
  const grid = document.getElementById("companyGrid");
  grid.innerHTML = "";
  if (error || !companies) return;

  const { data: employees } = await db.from("employees").select("client_company");
  const counts = {};
  for (const row of employees || []) {
    if (!row.client_company) continue;
    counts[row.client_company] = (counts[row.client_company] || 0) + 1;
  }

  for (const c of companies) {
    const a = document.createElement("a");
    a.className = "company-card";
    a.href = `admin.html?company=${encodeURIComponent(c.name)}`;
    a.innerHTML = `
      <span class="company-name">${c.name}</span>
      <span class="company-count">${counts[c.name] || 0} people</span>
    `;
    grid.appendChild(a);
  }
}

(async () => {
  ME = await requireSession("admin");
  if (!ME) return;
  document.getElementById("whoami").textContent = `${ME.full_name} · #${ME.file_number}`;
  await loadCompanies();
})();
</script>
</body>
</html>
