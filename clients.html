<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Companies — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
    <div class="brand"><a href="https://www.fwxperts.com/" target="_blank" rel="noopener noreferrer" style="line-height:0"><img src="images/logo.png" alt="FWX" class="brand-logo"></a> <span data-i18n="brandSupervisorPortal">Supervisor Portal</span></div>
    <div class="whoami" id="whoami">Loading…</div>
    <a href="settings.html" class="settings-link" data-i18n="settingsLink">⚙ Settings</a>
    <button class="logout" onclick="logout()" data-i18n="logout">Log out</button>
    <div class="sidebar-divider"></div>
    <nav>
      <a href="supervisor.html" data-i18n="navTeamOverview">Team overview</a>
      <a href="admin.html" data-i18n="navUsers">Users</a>
      <a href="clients.html" class="active" data-i18n="navClientCompanies">Client Companies</a>
      <a href="locations.html" data-i18n="navStaffLocations">Staff Locations</a>
    </nav>
  </aside>

  <main>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px">
      <div>
        <h1 class="page-title" style="margin-bottom:4px" data-i18n="clientCompaniesTitle">Client Companies</h1>
        <p class="page-sub" style="margin-bottom:0" data-i18n="clientCompaniesSub">Pick a company to manage its staff and supervisors.</p>
      </div>
      <button type="button" class="btn btn-primary" id="showAddCompanyBtn" style="width:220px" data-i18n="addNewClientCompanyBtn">+ Add new client company</button>
    </div>

    <div class="panel" id="addCompanyPanel" style="display:none; max-width:420px; margin:24px 0">
      <h2 data-i18n="newClientCompanyTitle">New client company</h2>
      <label for="newCompanyName" data-i18n="companyNameLabel">Company name</label>
      <input type="text" id="newCompanyName" placeholder="e.g. Vodafone" data-i18n-placeholder="companyNamePlaceholder">
      <div style="display:flex; gap:10px; margin-top:14px">
        <button type="button" class="btn btn-primary" id="saveCompanyBtn" style="width:140px" data-i18n="addBtn">Add</button>
        <button type="button" class="btn btn-danger" id="cancelCompanyBtn" data-confirm-close="1" style="width:140px" data-i18n="cancel">Cancel</button>
      </div>
      <div class="error-msg" id="companyError"></div>
    </div>

    <div class="company-grid" id="companyGrid"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Company action dialog (used for delete confirmation / cannot-delete notice) -->
<div id="companyActionOverlay" class="modal-overlay" style="display:none">
  <div class="modal-box" style="max-width:400px">
    <h2 id="companyActionTitle" style="margin:0 0 10px"></h2>
    <p id="companyActionMsg" style="margin:0 0 20px; color:var(--ink-soft); font-size:14.5px"></p>
    <div id="companyActionButtons" style="display:flex; gap:10px; justify-content:flex-end"></div>
  </div>
</div>

<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/i18n.js"></script>
<script>
initLangToggle();

let ME = null;

// Map company names (must match client_companies.name exactly) to their logo file paths.
// If a company has no entry here, its card simply renders without a logo image.
const COMPANY_LOGOS = {
  "F.W.X Company": "images/fwx.png",
  "Fiber-Tech": "images/fibertech.jpg",
  "MODEE": "images/modee.jpg",
  "Orange": "images/orange.jpg",
  "Umniah": "images/umniah.jpg",
  "Zain": "images/zain.jpg",
};

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2600);
}

document.getElementById("showAddCompanyBtn").addEventListener("click", () => {
  document.getElementById("addCompanyPanel").style.display = "";
  document.getElementById("newCompanyName").value = "";
  document.getElementById("companyError").classList.remove("show");
  document.getElementById("newCompanyName").focus();
});
document.getElementById("cancelCompanyBtn").addEventListener("click", () => {
  document.getElementById("addCompanyPanel").style.display = "none";
});

document.getElementById("saveCompanyBtn").addEventListener("click", async () => {
  const errBox = document.getElementById("companyError");
  errBox.classList.remove("show");
  const name = document.getElementById("newCompanyName").value.trim();
  if (!name) {
    errBox.textContent = t("enterCompanyName");
    errBox.classList.add("show");
    return;
  }

  const btn = document.getElementById("saveCompanyBtn");
  btn.disabled = true;
  btn.textContent = t("adding");

  const { error } = await db.from("client_companies").insert({ name });

  btn.disabled = false;
  btn.textContent = t("addBtn");

  if (error) {
    errBox.textContent = error.code === "23505" ? t("companyAlreadyExists") : t("somethingWrongAddingCompany");
    errBox.classList.add("show");
    return;
  }

  document.getElementById("addCompanyPanel").style.display = "none";
  showToast(t("companyAddedToast"));
  await loadCompanies();
});

async function loadCompanies() {
  const { data: companies, error } = await db.from("client_companies").select("*").order("name");
  const grid = document.getElementById("companyGrid");
  grid.innerHTML = "";
  if (error || !companies) return;

  const { data: employees } = await db.from("employees").select("client_company");
  const counts = {};
  for (const row of employees || []) {
    if (!row.client_company) continue;
    counts[row.client_company] = (counts[row.client_company] || 0) + 1;
  }

  for (const c of companies) {
    const card = document.createElement("div");
    card.className = "company-card";
    card.style.position = "relative";
    card.style.cursor = "pointer";
    const logoSrc = COMPANY_LOGOS[c.name];
    card.innerHTML = `
      <button type="button" class="company-menu-btn" data-company-menu="${c.id}" title="Options"
        style="position:absolute; top:8px; inset-inline-end:8px; background:rgba(255,255,255,0.18); border:none; color:#fff; font-size:20px; line-height:1; width:32px; height:32px; border-radius:6px; cursor:pointer; z-index:2">⋮</button>
      <div class="company-menu-dropdown" id="companyMenu-${c.id}"
        style="display:none; position:absolute; top:44px; inset-inline-end:8px; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.18); min-width:130px; z-index:3; overflow:hidden">
        <button type="button" class="company-menu-item" data-open-company="${c.name}"
          style="display:block; width:100%; text-align:start; padding:10px 14px; background:none; border:none; cursor:pointer; font-size:13.5px; color:var(--ink)">Open</button>
        <button type="button" class="company-menu-item" data-delete-company="${c.id}" data-company-name="${c.name}"
          style="display:block; width:100%; text-align:start; padding:10px 14px; background:none; border:none; cursor:pointer; font-size:13.5px; color:#c0392b">Delete</button>
      </div>
      ${logoSrc ? `<div class="company-logo-wrap"><img src="${logoSrc}" alt="${c.name} logo" class="company-logo"></div>` : ""}
      <span class="company-name">${c.name}</span>
      <span class="company-count">${counts[c.name] || 0} ${t("peopleSuffix")}</span>
    `;
    card.addEventListener("click", (e) => {
      if (e.target.closest("[data-company-menu]") || e.target.closest(".company-menu-dropdown")) return;
      window.location.href = `admin.html?company=${encodeURIComponent(c.name)}`;
    });
    grid.appendChild(card);
  }

  grid.querySelectorAll("[data-company-menu]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const targetId = `companyMenu-${btn.dataset.companyMenu}`;
      grid.querySelectorAll(".company-menu-dropdown").forEach(d => {
        d.style.display = (d.id === targetId && d.style.display === "none") ? "block" : "none";
      });
    });
  });

  grid.querySelectorAll("[data-open-company]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      window.location.href = `admin.html?company=${encodeURIComponent(btn.dataset.openCompany)}`;
    });
  });

  grid.querySelectorAll("[data-delete-company]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      grid.querySelectorAll(".company-menu-dropdown").forEach(d => d.style.display = "none");
      await handleDeleteCompany(btn.dataset.deleteCompany, btn.dataset.companyName);
    });
  });

  // Clicking anywhere outside a menu closes any open one.
  document.addEventListener("click", () => {
    grid.querySelectorAll(".company-menu-dropdown").forEach(d => d.style.display = "none");
  });
}

async function handleDeleteCompany(companyId, companyName) {
  const { count, error: countErr } = await db
    .from("employees")
    .select("id", { count: "exact", head: true })
    .eq("client_company", companyName);

  if (countErr) {
    showToast("Could not check this company's staff before deleting.");
    return;
  }
  if (count && count > 0) {
    await showCompanyInfo(
      "Cannot delete company",
      `"${companyName}" still has ${count} ${count === 1 ? "person" : "people"} (staff or supervisors) registered under it. Reassign or remove them first before deleting this company.`
    );
    return;
  }

  const confirmed = await showCompanyConfirm(
    "Delete company?",
    `Delete "${companyName}"? This cannot be undone.`,
    "Delete"
  );
  if (!confirmed) return;

  const { error: delErr } = await db.from("client_companies").delete().eq("id", companyId);
  if (delErr) {
    showToast("Could not delete this company.");
    return;
  }
  showToast("Company deleted.");
  await loadCompanies();
}

// Small self-contained info/confirm dialog for this page (Open button here
// is a pure notification and intentionally has no id, so it's naturally
// excluded from the system-wide auto-confirm-on-close behavior).
function showCompanyInfo(title, msg) {
  return new Promise((resolve) => {
    document.getElementById("companyActionTitle").textContent = title;
    document.getElementById("companyActionMsg").textContent = msg;
    const btns = document.getElementById("companyActionButtons");
    btns.innerHTML = "";
    const ok = document.createElement("button");
    ok.type = "button";
    ok.className = "btn btn-primary btn-sm";
    ok.textContent = "OK";
    ok.onclick = () => { document.getElementById("companyActionOverlay").style.display = "none"; resolve(); };
    btns.appendChild(ok);
    document.getElementById("companyActionOverlay").style.display = "flex";
  });
}

function showCompanyConfirm(title, msg, confirmLabel) {
  return new Promise((resolve) => {
    document.getElementById("companyActionTitle").textContent = title;
    document.getElementById("companyActionMsg").textContent = msg;
    const btns = document.getElementById("companyActionButtons");
    btns.innerHTML = "";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "btn btn-primary btn-sm";
    cancel.textContent = "Discard";
    cancel.onclick = () => { document.getElementById("companyActionOverlay").style.display = "none"; resolve(false); };
    const ok = document.createElement("button");
    ok.type = "button";
    ok.className = "btn btn-danger btn-sm";
    ok.textContent = confirmLabel;
    ok.onclick = () => { document.getElementById("companyActionOverlay").style.display = "none"; resolve(true); };
    btns.appendChild(cancel);
    btns.appendChild(ok);
    document.getElementById("companyActionOverlay").style.display = "flex";
  });
}

(async () => {
  ME = await requireSession("admin");
  if (!ME) return;
  document.getElementById("whoami").textContent = `${ME.full_name} · #${ME.file_number}`;
  await loadCompanies();
})();
</script>
</body>
</html>
