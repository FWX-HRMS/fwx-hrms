<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-spectrum"></div>
    <div class="login-lightorb login-lightorb-1"></div>
    <div class="login-lightorb login-lightorb-2"></div>
    <div class="login-lightorb login-lightorb-3"></div>
    <div class="login-lightorb login-lightorb-4"></div>
    <div class="login-mist"></div>
    <form class="login-card" id="loginForm">
      <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
      <div class="login-logo-row">
        <img src="images/logo.png" alt="FWX" class="login-logo">
        <span class="login-logo-text">FWX HR System</span>
      </div>
      <h1 data-i18n="signInTitle">Sign in</h1>
      <p class="sub" data-i18n="signInSub">Use your employee file number and password.</p>

      <label for="fileNumber" data-i18n="fileNumberLabel">File number</label>
      <input type="text" id="fileNumber" autocomplete="username" required>

      <label for="password" data-i18n="passwordLabel">Password</label>
      <div style="position:relative">
        <input type="password" id="password" autocomplete="current-password" required style="padding-inline-end:40px">
        <button type="button" id="togglePasswordBtn" aria-label="Show password" style="position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; color:var(--ink-soft, #6b7684)">
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="signInBtn">Sign in</button>
      <div class="error-msg" id="errorMsg"></div>
      <p class="forgot-link"><a href="forgot-password.html" data-i18n="forgotPasswordLink">Forgot your password?</a></p>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.getElementById("langToggleBtn").classList.add("lang-toggle");
    initLangToggle();

    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const eyeIcon = document.getElementById("eyeIcon");
    const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
    const EYE_CLOSED = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeIcon.innerHTML = isPassword ? EYE_CLOSED : EYE_OPEN;
      togglePasswordBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    });

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    if (new URLSearchParams(window.location.search).get("frozen") === "1") {
      errorMsg.textContent = t("accountSuspendedLoginMsg");
      errorMsg.classList.add("show");
    }

    // If already logged in, skip straight to the right portal.
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        const { data: me } = await db.from("employees").select("role, frozen").eq("id", session.user.id).single();
        if (me && me.frozen) {
          await db.auth.signOut();
          document.getElementById("errorMsg").textContent = t("accountSuspendedLoginMsg");
          document.getElementById("errorMsg").classList.add("show");
          return;
        }
        window.location.href = (me && me.role !== "staff") ? "supervisor.html" : "staff.html";
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = t("signingIn");

      const fileNumber = document.getElementById("fileNumber").value.trim();
      const password = document.getElementById("password").value;

      const email = await lookupEmailForFileNumber(fileNumber);
      if (!email) {
        errorMsg.textContent = t("incorrectCreds");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        errorMsg.textContent = t("incorrectCreds");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      const { data: me } = await db
        .from("employees")
        .select("role, frozen")
        .eq("id", data.user.id)
        .single();

      if (me && me.frozen) {
        await db.auth.signOut();
        errorMsg.textContent = t("accountSuspendedLoginMsg");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      window.location.href = (me && me.role !== "staff") ? "supervisor.html" : "staff.html";
    });
  </script>
</body>
</html>
