<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-heavyrain"></div>
    <div class="login-heavyrain login-heavyrain-2"></div>
    <div class="login-fogbank login-fogbank-1"></div>
    <div class="login-fogbank login-fogbank-2"></div>
    <div class="login-fogbank login-fogbank-3"></div>
    <div class="login-mountains">
      <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <polygon class="ridge-back" points="-20,420 -20,328 97,295 214,324 331,347 449,316 566,353 683,354 800,236 917,292 1034,317 1151,359 1269,356 1386,306 1503,329 1620,324 1620,420 -20,420"/>
        <polygon class="ridge-mid" points="-20,460 -20,153 144,137 308,138 472,320 636,308 800,229 964,230 1128,344 1292,203 1456,240 1620,228 1620,460 -20,460"/>
        <polygon class="ridge-front" points="-20,500 -20,283 82,258 185,275 288,108 390,278 492,243 595,295 698,276 800,309 902,335 1005,266 1108,255 1210,284 1312,209 1415,312 1518,250 1620,328 1620,500 -20,500"/>
      </svg>
    </div>
    <div class="login-foreground"></div>
    <div class="login-mist"></div>
    <form class="login-card" id="loginForm">
      <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
      <img src="images/logo.png" alt="FWX" class="login-logo">
      <h1 data-i18n="signInTitle">Sign in</h1>
      <p class="sub" data-i18n="signInSub">Use your employee file number and password.</p>

      <label for="fileNumber" data-i18n="fileNumberLabel">File number</label>
      <input type="text" id="fileNumber" autocomplete="username" required>

      <label for="password" data-i18n="passwordLabel">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="signInBtn">Sign in</button>
      <div class="error-msg" id="errorMsg"></div>
      <p class="forgot-link"><a href="forgot-password.html" data-i18n="forgotPasswordLink">Forgot your password?</a></p>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.getElementById("langToggleBtn").classList.add("lang-toggle");
    initLangToggle();

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    if (new URLSearchParams(window.location.search).get("frozen") === "1") {
      errorMsg.textContent = t("accountSuspendedLoginMsg");
      errorMsg.classList.add("show");
    }

    // If already logged in, skip straight to the right portal.
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        const { data: me } = await db.from("employees").select("role, frozen").eq("id", session.user.id).single();
        if (me && me.frozen) {
          await db.auth.signOut();
          document.getElementById("errorMsg").textContent = t("accountSuspendedLoginMsg");
          document.getElementById("errorMsg").classList.add("show");
          return;
        }
        window.location.href = (me && me.role !== "staff") ? "supervisor.html" : "staff.html";
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = t("signingIn");

      const fileNumber = document.getElementById("fileNumber").value.trim();
      const password = document.getElementById("password").value;

      const email = await lookupEmailForFileNumber(fileNumber);
      if (!email) {
        errorMsg.textContent = t("incorrectCreds");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        errorMsg.textContent = t("incorrectCreds");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      const { data: me } = await db
        .from("employees")
        .select("role, frozen")
        .eq("id", data.user.id)
        .single();

      if (me && me.frozen) {
        await db.auth.signOut();
        errorMsg.textContent = t("accountSuspendedLoginMsg");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      window.location.href = (me && me.role !== "staff") ? "supervisor.html" : "staff.html";
    });
  </script>
</body>
</html>
