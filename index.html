<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-orb login-orb-1"></div>
    <div class="login-orb login-orb-2"></div>
    <div class="login-orb login-orb-3"></div>
    <div class="login-orb login-orb-4"></div>
    <div class="login-rain"></div>
    <div class="login-rain login-rain-2"></div>
    <div class="login-fireflies">
      <div class="login-firefly"></div>
      <div class="login-firefly"></div>
      <div class="login-firefly"></div>
      <div class="login-firefly"></div>
      <div class="login-firefly"></div>
      <div class="login-firefly"></div>
    </div>
    <div class="login-mist"></div>
    <form class="login-card" id="loginForm">
      <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
      <img src="images/logo.png" alt="FWX" class="login-logo">
      <h1 data-i18n="signInTitle">Sign in</h1>
      <p class="sub" data-i18n="signInSub">Use your employee file number and password.</p>

      <label for="fileNumber" data-i18n="fileNumberLabel">File number</label>
      <input type="text" id="fileNumber" autocomplete="username" required>

      <label for="password" data-i18n="passwordLabel">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="signInBtn">Sign in</button>
      <div class="error-msg" id="errorMsg"></div>
      <p class="forgot-link"><a href="forgot-password.html" data-i18n="forgotPasswordLink">Forgot your password?</a></p>
    </form>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.getElementById("langToggleBtn").classList.add("lang-toggle");
    initLangToggle();

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    if (new URLSearchParams(window.location.search).get("frozen") === "1") {
      errorMsg.textContent = t("accountSuspendedLoginMsg");
      errorMsg.classList.add("show");
    }

    // If already logged in, skip straight to the right portal.
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        const { data: me } = await db.from("employees").select("role, frozen").eq("id", session.user.id).single();
        if (me && me.frozen) {
          await db.auth.signOut();
          document.getElementById("errorMsg").textContent = t("accountSuspendedLoginMsg");
          document.getElementById("errorMsg").classList.add("show");
          return;
        }
        window.location.href = (me && me.role !== "staff") ? "supervisor.html" : "staff.html";
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = t("signingIn");

      const fileNumber = document.getElementById("fileNumber").value.trim();
      const password = document.getElementById("password").value;

      const email = await lookupEmailForFileNumber(fileNumber);
      if (!email) {
        errorMsg.textContent = t("incorrectCreds");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        errorMsg.textContent = t("incorrectCreds");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      const { data: me } = await db
        .from("employees")
        .select("role, frozen")
        .eq("id", data.user.id)
        .single();

      if (me && me.frozen) {
        await db.auth.signOut();
        errorMsg.textContent = t("accountSuspendedLoginMsg");
        errorMsg.classList.add("show");
        submitBtn.disabled = false;
        submitBtn.textContent = t("signInBtn");
        return;
      }

      window.location.href = (me && me.role !== "staff") ? "supervisor.html" : "staff.html";
    });
  </script>
</body>
</html>
