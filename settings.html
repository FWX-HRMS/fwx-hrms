<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button type="button" class="lang-toggle" id="langToggleBtn">العربية</button>
    <div class="brand"><a href="https://www.fwxperts.com/" target="_blank" rel="noopener noreferrer" style="line-height:0"><img src="images/logo.png" alt="FWX" class="brand-logo"></a> <span data-i18n="brandHrPortal">HR Portal</span></div>
    <div class="whoami" id="whoami">Loading…</div>
    <nav>
      <a href="#" id="backLink" data-i18n="back">← Back</a>
    </nav>
    <button class="logout" onclick="logout()" data-i18n="logout">Log out</button>
  </aside>

  <main>
    <h1 class="page-title" data-i18n="settingsTitle">Settings</h1>
    <p class="page-sub" data-i18n="settingsSub">Update your name, email, or password.</p>

    <div class="panel">
      <h2 data-i18n="yourNameTitle">Your name</h2>
      <form id="nameForm">
        <label for="fullName" data-i18n="fullNameLabel">Full name</label>
        <input type="text" id="fullName" required>
        <button type="submit" class="btn btn-primary btn-sm" style="max-width:180px; margin-top:14px" data-i18n="saveNameBtn">Save name</button>
        <div class="error-msg" id="nameError"></div>
        <div class="success-msg" id="nameSuccess" data-i18n="nameUpdatedMsg">Name updated.</div>
      </form>
    </div>

    <div class="panel">
      <h2 data-i18n="yourEmailTitle">Your email</h2>
      <p class="help-text" style="margin-bottom:14px"><span data-i18n="currentLabel">Current:</span> <strong id="currentEmail">—</strong></p>
      <form id="emailForm">
        <label for="newEmail" data-i18n="newEmailLabel">New email address</label>
        <input type="email" id="newEmail" required>
        <button type="submit" class="btn btn-primary btn-sm" style="max-width:180px; margin-top:14px" data-i18n="updateEmailBtn">Update email</button>
        <div class="error-msg" id="emailError"></div>
        <div class="success-msg" id="emailSuccess" data-i18n="emailChangeConfirmMsg">A confirmation link was sent to your new email. Please check your inbox and confirm it — your login will use the new address once confirmed.</div>
      </form>
    </div>

    <div class="panel">
      <h2 data-i18n="changePasswordTitle">Change password</h2>
      <form id="passwordForm">
        <div class="field-row">
          <div>
            <label for="newPassword" data-i18n="newPasswordLabel">New password</label>
            <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
          </div>
          <div>
            <label for="confirmPassword" data-i18n="confirmNewPasswordLabel">Confirm new password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm" style="max-width:200px; margin-top:6px" data-i18n="updatePasswordBtn">Update password</button>
        <div class="error-msg" id="pwError"></div>
      </form>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/i18n.js"></script>
<script>initLangToggle();</script>
<script src="js/settings.js"></script>
</body>
</html>
