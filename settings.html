<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — HR Portal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="images/logo.png" alt="FWX" class="brand-logo"> HR Portal</div>
    <div class="whoami" id="whoami">Loading…</div>
    <nav>
      <a href="#" id="backLink">← Back</a>
    </nav>
    <button class="logout" onclick="logout()">Log out</button>
  </aside>

  <main>
    <h1 class="page-title">Settings</h1>
    <p class="page-sub">Update your name, email, or password.</p>

    <div class="panel">
      <h2>Your name</h2>
      <form id="nameForm">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required>
        <button type="submit" class="btn btn-primary btn-sm" style="max-width:180px; margin-top:14px">Save name</button>
        <div class="error-msg" id="nameError"></div>
        <div class="success-msg" id="nameSuccess">Name updated.</div>
      </form>
    </div>

    <div class="panel">
      <h2>Your email</h2>
      <p class="help-text" style="margin-bottom:14px">Current: <strong id="currentEmail">—</strong></p>
      <form id="emailForm">
        <label for="newEmail">New email address</label>
        <input type="email" id="newEmail" required>
        <button type="submit" class="btn btn-primary btn-sm" style="max-width:180px; margin-top:14px">Update email</button>
        <div class="error-msg" id="emailError"></div>
        <div class="success-msg" id="emailSuccess">A confirmation link was sent to your new email. Please check your inbox and confirm it — your login will use the new address once confirmed.</div>
      </form>
    </div>

    <div class="panel">
      <h2>Change password</h2>
      <form id="passwordForm">
        <div class="field-row">
          <div>
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
          </div>
          <div>
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm" style="max-width:200px; margin-top:6px">Update password</button>
        <div class="error-msg" id="pwError"></div>
      </form>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
